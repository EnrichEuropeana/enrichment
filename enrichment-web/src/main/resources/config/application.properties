# configured in <profiles/> section in parent pom.xml
# we inject entitymanagment.properties in Jenkins builds, so this property needs to be specified here
spring.profiles.active=${activeProfile}

# may deploy application with context, no used
#server.servlet.context-path=/enrichment-k8s
#spring.application.name=Enrichment Web API
#project.version=Version 
info.app.name=${spring.application.name}
info.app.version=${project.version}
info.app.description=API computing enrichments for Transcribathon transcriptions

#switch Spring boot logging to log4j (see https://docs.spring.io/spring-boot/docs/current/reference/htmlsingle/#features.logging)
org.springframework.boot.logging.LoggingSystem= org.springframework.boot.logging.log4j2.Log4J2LoggingSystem

## management / actuator / swagger
#springfox.documentation.swagger-ui.enabled=true
management.security.enabled=false

management.endpoints.web.exposure.include=health,info
# for debugging conditioonal annotations locally the following configuration can be used
management.info.build.enabled=true
management.info.git.enabled=true
management.health.probes.enabled=true

## Configurations for swagger console
springdoc.paths-to-exclude=/error
springdoc.show-actuator=true

## server configurations
server.port = 8080
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-exception=false
#server.error.include-exception=true
#server.error.see-also=https://github.com/EnrichEuropeana/Technical-Documentation
