apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrichment-web-deployment
spec:
  # selector.matchLabels is provided via Kustomize ()
  #selector:
  #  matchLabels:
  #    app: enrichment-web
  ## in jenins use kustomize edit set label app:${APP_NAME}
  template:
    spec:
      containers:
      - name: enrichment-web
        image: gsergiu79/enrichment-web
        env:
          - name: SPRING_CONFIG_NAME
            value: "application,enrichment,enrichment.user"
          - name: SPRING_CONFIG_ADDITIONAL_LOCATION
            value: "file:/opt/app/config/application.properties,file:/opt/app/config/enrichment.user.properties"
        ports:
          - containerPort: 8080
        volumeMounts:
          - name: enrichment-properties
            mountPath: "/opt/app/config/enrichment.user.properties"
            readOnly: true
            subPath: enrichment.user.properties
          - name: log4j-config
            mountPath: "/opt/app/config/log4j2-spring.xml"
            readOnly: true
            subPath: log4j2-spring.xml
          - name: gtanslate-credentials
            mountPath: "/opt/app/enrich/secrets/gtanslate.json"
            readOnly: true
            subPath: gtanslate.json
          - name: etanslate-credentials
            mountPath: "/opt/app/enrich/secrets/eTranslation.txt"
            readOnly: true
            subPath: eTranslation.txt
          - name: deepl-credentials
            mountPath: "/opt/app/enrich/secrets/deeplAuthentication.txt"
            readOnly: true
            subPath: deeplAuthentication.txt      
                
      volumes:
        - name: enrichment-properties
          secret:
            secretName: enrichment-web-properties
        - name: gtanslate-credentials
          secret:
            secretName: gtanslate-secret
        - name: etanslate-credentials
          secret:
            secretName: etanslate-secret    
        - name: deepl-credentials
          secret:
            secretName: deepl-secret        
        - name: log4j-config
          configMap:
            name: log4j2-properties    
