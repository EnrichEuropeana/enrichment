apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrichment-web-deployment
spec:
  # selector.matchLabels is provided via Kustomize
  #selector:
  #  matchLabels:
  #    app: annotation-api
  template:
    spec:
      containers:
      - name: enrichment-web
        image: gsergiu79/enrichment-web
        env:
          - name: SPRING_CONFIG_NAME
            value: "enrichment"
          - name: SPRING_CONFIG_ADDITIONAL_LOCATION
            value: "/opt/app/config/enrichment.properties"
        ports:
          - containerPort: 8080
        livenessProbe:
          httpGet:
            port: 8080
            path: /actuator/health/liveness
            httpHeaders:
            - name: Accept
              value: application/json
          initialDelaySeconds: 55
          periodSeconds: 20
        readinessProbe:
          httpGet:
            port: 8080
            path: /actuator/health/readiness
            httpHeaders:
            - name: Accept
              value: application/json
          initialDelaySeconds: 55
          periodSeconds: 20
        volumeMounts:
          - name: enrichment-properties
            mountPath: "/opt/app/config/enrichment.properties"
            readOnly: true
            subPath: enrichment.properties
          - name: app-properties
            mountPath: "/opt/app/config/application.properties"
            readOnly: true
            subPath: application.properties
          - name: log4j-config
            mountPath: "/opt/app/config/log4j2-spring.xml"
            readOnly: true
            subPath: log4j2-spring.xml
          - name: gtanslate-credentials
            mountPath: "/opt/app/secrets/gtanslate.json"
            readOnly: true
            subPath: gtanslate.json
          - name: etanslate-credentials
            mountPath: "/opt/app/secrets/eTranslation.txt"
            readOnly: true
            subPath: eTranslation.txt
          - name: deepl-credentials
            mountPath: "/opt/app/secrets/deeplAuthentication.txt"
            readOnly: true
            subPath: deeplAuthentication.txt      
                
      volumes:
        - name: enrichment-properties
          secret:
            secretName: enrichment-web-properties
        - name: gtanslate-credentials
          secret:
            secretName: gtanslate-secret
        - name: etanslate-credentials
          secret:
            secretName: etanslate-secret    
        - name: deepl-credentials
          secret:
            secretName: deepl-secret        
        - name: app-properties
          secret:
            secretName: application-properties
        - name: log4j-config
          configMap:
            name: log4j2-properties    
